<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLW · 开发对话</title><link rel="stylesheet" href="/harness.css"><script type="module" src="/harness-ui.mjs"></script></head>
<body>
<aside class="sidebar" id="sidebar"><div class="brand"><span class="logo">C</span><strong>CLW</strong><span class="alpha">Harness α</span></div><button id="newThread" class="new-thread">＋ 新建 Codex 对话</button><input id="threadSearch" type="search" placeholder="搜索对话" aria-label="搜索对话"><div class="section-label">当前项目</div><div class="project"><span>▧</span><span id="projectName">正在连接本机…</span></div><nav id="threadList" aria-label="开发对话与分支"></nav><div class="sidebar-bottom"><button id="showTeam" class="primary-nav">自动协作</button><button id="connectCodex">本地 Codex</button><button id="showConnection">连接</button><details class="sidebar-advanced"><summary>高级与诊断</summary><button id="connectWeb">旧 Web 接入</button><button id="showBranches">分支与结果</button><button id="showRecovery">故障恢复</button><button id="showControl">网页载体诊断</button></details><button id="themeToggle" class="quiet-nav">切换明暗主题</button><div class="small">AI 决定工作 · CLW 管可靠执行与恢复</div></div></aside>
<main><header><button id="toggleSidebar" class="icon" aria-label="切换侧栏">☰</button><div class="heading"><h1 id="threadTitle">开发对话</h1><span id="threadMeta">原生 Web 与本地 Codex，保留各自运行身份</span></div><button id="syncThread" class="quiet">核对原生状态</button><button id="forkThread" class="quiet">分叉历史</button><button id="showDiff" class="quiet">变更</button><button id="showArtifacts" class="quiet">产物</button></header>
<div class="notice" id="notice" role="status" hidden></div><div id="pendingBox" class="pending" hidden><span>有一项请求尚未确认；不会重复执行。</span><button id="reconcile">核对原请求</button></div>
<section id="conversation" class="conversation" aria-label="当前开发对话"><div class="welcome"><div class="welcome-mark">C</div><h2>把想法，变成实际改动。</h2><p>连接已有本地 Codex，创建真实会话，直接开始开发。<br>原生 Web 的通信状态独立显示，不会自动换模型。</p><div class="welcome-hint">文件、终端和推理由原生运行时负责。这里保存工作联系与结果，不规定你的开发流程。</div></div></section>
<div id="approvals" class="approvals" aria-live="polite"></div>
<footer><form id="composer"><textarea id="prompt" rows="3" placeholder="告诉 AI 要完成什么。Shift + Enter 换行。" aria-label="开发要求" disabled></textarea><div class="compose-actions"><div><span class="provider-chip" id="providerChip">选择运行载体</span><span id="modelInfo" class="small">沿用你的模型和思考配置</span></div><div><button id="stopTurn" type="button" class="stop" hidden>停止当前执行</button><button id="send" type="submit" class="send" disabled>发送 ↑</button></div></div></form><div class="footer-meta"><span id="connectionState">正在连接…</span><span>新页面已接真实协议 · 不是演示聊天</span></div></footer>
</main>
<aside class="details" id="details" hidden><div class="detail-head"><strong id="detailTitle">变更</strong><button id="closeDetails" class="icon" aria-label="关闭详情">×</button></div><div id="detailContent"></div></aside>
</body></html>
