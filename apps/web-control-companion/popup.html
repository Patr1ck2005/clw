<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CLW 原请求接管</title><link rel="stylesheet" href="popup.css"><body><h1>绑定本标签页的控制载体</h1><p>先在CLW面板“网页接管”生成单独控制码。旧恢复配对不会升级权限。</p><label>配对码<input id="code" maxlength="16" autocomplete="off" spellcheck="false"></label><label class="check"><input id="confirm" type="checkbox">确认本页已手动切到 Sol / Medium（中等）或 Extra High（极高）；不使用 Pro。允许原请求接管及每请求最多3次明确生成失败恢复提示。</label><button id="inspect">查看本页识别状态（不发送）</button><button id="pair">确认并配对本标签页</button><button id="resume">刷新后恢复观察（不重发）</button><button id="stop">停用控制载体</button><p id="status" role="status"></p><small>模型和档位标签不明确时停止。明确新生成错误按15/45/120秒退避；长思考/草稿/停止/权限/额度拒绝不重试。浏览器重启需新配对；UI标签并非计费认证。</small><script src="policy.js"></script><script src="popup.js"></script></body></html>
